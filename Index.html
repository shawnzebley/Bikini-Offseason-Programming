  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 eyebrowStyle }}\">{{ eyebrow }}<\u002Fdiv>\n    <div style=\"font-family:'Syne',sans-serif;font-weight:800;color:#fff;font-size:32px;line-height:.98;letter-spacing:.005em;margin-top:6px;\">{{ title }}<\u002Fdiv>\n    <div style=\"display:flex;gap:4px;margin-top:16px;background:#3a3338;padding:5px;border-radius:13px;\">\n      <sc-for list=\"{{ dayTabs }}\" as=\"tab\" hint-placeholder-count=\"5\">\n        <div style=\"{{ tab.style }}\" sc-camel-on-click=\"{{ tab.onClick }}\">{{ tab.label }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:16px 16px calc(env(safe-area-inset-bottom) + 44px);\">\n\n    <div style=\"background:#2b2529;border-radius:16px;padding:15px 18px;cursor:pointer;\" sc-camel-on-click=\"{{ onToggleProgress }}\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;\">\n        <div>\n          <div style=\"{{ progressLabelStyle }}\">HOW TO PROGRESS<\u002Fdiv>\n          <div style=\"color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;margin-top:3px;\">Double progression<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"color:#c8bfc4;font-size:12.5px;font-family:'Space Grotesk';font-weight:600;white-space:nowrap;\">{{ progressToggleLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ progressOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"color:#c8bfc4;font-family:'Space Grotesk';font-size:14px;line-height:1.55;margin-top:13px;border-top:1px solid #4a4348;padding-top:13px;\">\n          Pick a weight you can lift for the <b style=\"color:#fff;\">bottom<\u002Fb> of each rep range. Keep it every session until you hit the <b style=\"color:#fff;\">top<\u002Fb> of the range on <b style=\"color:#fff;\">one set<\u002Fb> — <b style=\"color:#fff;\">and<\u002Fb> don't fall below the <b style=\"color:#fff;\">bottom<\u002Fb> of the range on any other set. When both are true, the app estimates your 1-rep max and prescribes a heavier weight — then you drop back to the bottom of the range and climb again.\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;margin:22px 2px 14px;gap:12px;\">\n      <div style=\"font-family:'Syne',sans-serif;font-weight:800;font-size:29px;line-height:1.02;color:#2b2529;letter-spacing:.005em;\">{{ sectionTitle }}<\u002Fdiv>\n      <div style=\"{{ locationStyle }}\">{{ locationLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ readonly }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#fff;border:1.5px dashed #ddd4d9;border-radius:14px;padding:15px 17px;margin-bottom:14px;color:#8a8289;font-family:'Space Grotesk';font-size:13.5px;line-height:1.5;\">\n        <b style=\"color:#2b2529;\">Up next.<\u002Fb> {{ readonlyNote }}\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px;\">\n      <sc-for list=\"{{ exercises }}\" as=\"ex\" hint-placeholder-count=\"6\">\n        <div style=\"background:#fff;border-radius:18px;padding:16px 16px 14px;box-shadow:0 1px 3px rgba(43,37,41,.05),0 10px 24px -16px rgba(43,37,41,.22);\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;color:#2b2529;line-height:1.1;margin-right:2px;\">{{ ex.name }}<\u002Fdiv>\n            <sc-for list=\"{{ ex.tags }}\" as=\"tag\" hint-placeholder-count=\"1\">\n              <span style=\"{{ tag.style }}\">{{ tag.label }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;margin-top:9px;font-family:'Space Grotesk';font-size:14.5px;\">\n            <span style=\"{{ ex.kindStyle }}\">{{ ex.kindLabel }}<\u002Fspan>\n            <span style=\"font-weight:800;color:#2b2529;\">{{ ex.scheme }}<\u002Fspan>\n            <a href=\"{{ ex.videoUrl }}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"margin-left:auto;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:.04em;padding:6px 11px;border-radius:8px;border:1.5px solid #ffb8d5;color:#d61f6b;background:#fff;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:4px;\">▶ Demo<\u002Fa>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ ex.interactive }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:13px;border-top:1px solid #f0eaed;padding-top:13px;\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;\">\n                <div style=\"font-family:'Space Grotesk';font-size:12px;font-weight:800;letter-spacing:.05em;color:#8a8289;text-transform:uppercase;\">{{ ex.goalText }}<\u002Fdiv>\n                <div style=\"{{ ex.verdictChipStyle }}\">{{ ex.verdictLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family:'Space Grotesk';font-size:13px;color:#a89fa4;margin-top:6px;\">{{ ex.lastText }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:12px;\">\n                <sc-for list=\"{{ ex.sets }}\" as=\"set\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:center;gap:9px;\">\n                    <div style=\"font-family:'Syne',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;color:#b6adb2;width:40px;flex:none;text-transform:uppercase;\">{{ set.label }}<\u002Fdiv>\n                    <sc-if value=\"{{ set.showWeight }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"display:flex;align-items:center;gap:5px;flex:1;background:#f5f1f3;border-radius:10px;padding:11px 12px;\">\n                        <input type=\"number\" inputmode=\"decimal\" value=\"{{ set.w }}\" sc-camel-on-change=\"{{ set.onWeight }}\" sc-camel-on-input=\"{{ set.onWeight }}\" placeholder=\"{{ set.wph }}\" style=\"border:none;background:transparent;width:100%;min-width:0;font-size:17px;font-weight:800;color:#2b2529;outline:none;padding:0;\">\n                        <span style=\"font-family:'Space Grotesk';font-size:12px;font-weight:700;color:#b6adb2;\">lb<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <div style=\"{{ set.repsWrapStyle }}\">\n                      <input type=\"number\" inputmode=\"numeric\" value=\"{{ set.r }}\" sc-camel-on-change=\"{{ set.onReps }}\" sc-camel-on-input=\"{{ set.onReps }}\" placeholder=\"{{ set.rph }}\" style=\"border:none;background:transparent;width:100%;min-width:0;font-size:17px;font-weight:800;color:#2b2529;outline:none;padding:0;\">\n                      <span style=\"font-family:'Space Grotesk';font-size:12px;font-weight:700;color:#b6adb2;\">reps<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"{{ set.checkStyle }}\">✓<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-family:'Space Grotesk';font-size:12.5px;font-weight:700;color:#2b2529;margin-top:12px;\">{{ ex.e1rmText }}<\u002Fdiv>\n              <div style=\"font-family:'Space Grotesk';font-size:13px;line-height:1.45;color:#8a8289;margin-top:3px;\">{{ ex.verdictDetail }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ interactive }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:18px;\">\n        <div style=\"{{ draftNoteStyle }}\">{{ draftNote }}<\u002Fdiv>\n        <sc-if value=\"{{ saved }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"{{ savedBannerStyle }}\">{{ savedText }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ onSave }}\" style=\"{{ saveBtnStyle }}\">SAVE WORKOUT<\u002Fbutton>\n        <div style=\"display:flex;gap:10px;margin-top:10px;align-items:center;\">\n          <sc-if value=\"{{ saved }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ onStartNext }}\" style=\"{{ startNextStyle }}\">Start next session ↻<\u002Fbutton>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ onReset }}\" style=\"font-family:'Space Grotesk';font-size:13px;font-weight:700;color:#a89fa4;background:transparent;border:none;cursor:pointer;padding:12px 8px;\">Clear sets<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  DISPLAY = \"'Syne', sans-serif\";\n  BODY = \"'Space Grotesk', sans-serif\";\n  PINK = '#ff2e88';\n  KEY = 'gfs_split_v3';\n  DRAFT_KEY = 'gfs_split_v3_draft';\n\n  // ── EXERCISE VIDEO REPOSITORY ─────────────────────────────────────────\n  // Add a direct YouTube (or any) link per exercise NAME to override the\n  // default. Any exercise without an entry opens a YouTube search for its\n  // name, so the ▶ Demo button always leads somewhere useful.\n  //   'Barbell Hip Thrust': 'https://www.youtube.com/watch?v=xxxxxxxxxxx',\n  VIDEOS = {\n  };\n\n  videoFor(ex) {\n    if (this.VIDEOS[ex.name]) return this.VIDEOS[ex.name];\n    return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(ex.name + ' exercise form');\n  }\n\n  state = {\n    activeDay: 1,\n    progressOpen: false,\n    saved: false,\n    savedOk: false,\n    savedText: '',\n    session: this.readDraft(),\n    store: this.readStore(),\n  };\n\n  readStore() {\n    try {\n      const raw = localStorage.getItem('gfs_split_v3');\n      if (raw) { const o = JSON.parse(raw); if (o && o.history) { if (!o.performed) o.performed = {}; return o; } }\n    } catch (e) {}\n    return { history: {}, performed: {} };\n  }\n\n  // Draft = weights/reps typed but not yet saved. Persisted on every\n  // keystroke and restored on load so nothing is lost on refresh/close.\n  readDraft() {\n    try {\n      const raw = localStorage.getItem('gfs_split_v3_draft');\n      if (raw) { const o = JSON.parse(raw); if (o && typeof o === 'object') return o; }\n    } catch (e) {}\n    return {};\n  }\n\n  writeDraft(session) {\n    try { localStorage.setItem(this.DRAFT_KEY, JSON.stringify(session)); } catch (e) {}\n  }\n\n  epley(w, r) { return w * (1 + r / 30); }\n  wForReps(e, r) { return e / (1 + r / 30); }\n  round25(v) { return Math.round(v / 2.5) * 2.5; }\n  round05(v) { return Math.round(v * 2) / 2; }\n  fmt(n) {\n    if (n == null || isNaN(n)) return '\\u2014';\n    return Number.isInteger(n) ? String(n) : (n.toFixed(1).replace(/\\.0$/, ''));\n  }\n\n  tagStyle(t) {\n    const gray = { color: '#6b6469', bg: '#f2eff1', border: '#ddd4d9' };\n    const pink = { color: '#d61f6b', bg: '#ffe6f0', border: '#ffb8d5' };\n    const rside = { color: '#b81a5c', bg: '#fff', border: '#ff9ec4' };\n    const m = { glutes: pink, glutemed: pink, gluteham: pink, shoulders: pink, rside: rside };\n    return m[t] || gray;\n  }\n\n  buildDays() {\n    return [\n      {\n        section: 'Glutes', location: 'GYM',\n        exercises: [\n          { id: 'g1', name: 'Barbell Hip Thrust',           kind: 'main', sets: 3, low: 6, high: 9,  each: false, tags: [{ label: 'Glutes', type: 'glutes', star: true }] },\n          { id: 'g4', name: 'Glute Runner Machine',         kind: 'acc',  sets: 2, low: 6, high: 9,  each: true,  tags: [{ label: 'Glutes', type: 'glutes', star: true }] },\n          { id: 'g3', name: 'Deficit DB Deadlift (double contraction)', kind: 'main', sets: 2, low: 6, high: 9, each: false, tags: [{ label: 'Glutes / Hams', type: 'gluteham', star: true }] },\n          { id: 'g2', name: 'Single-Leg Weighted Hyperextension', kind: 'main', sets: 2, low: 9, high: 12, each: true, tags: [{ label: 'Glutes', type: 'glutes', star: true }] },\n          { id: 'g5', name: 'Cable Glute Side Raise',       kind: 'acc',  sets: 2, low: 9, high: 12, each: true,  tags: [{ label: 'Glute Med', type: 'glutemed', star: true }] },\n          { id: 'g6', name: 'Standing Calf Raise',          kind: 'acc',  sets: 3, low: 9, high: 12, each: false, tags: [{ label: 'Calves', type: 'calves' }] },\n        ],\n      },\n      {\n        section: 'Upper Body', location: 'GYM',\n        exercises: [\n          { id: 's1', name: 'Seated DB Shoulder Press',     kind: 'main', sets: 3, low: 6, high: 9,  each: false, tags: [{ label: 'Shoulders', type: 'shoulders', star: true }] },\n          { id: 's2', name: 'Bent EZ Bar Rear Delt Flyes',  kind: 'acc',  sets: 3, low: 9, high: 12, each: false, tags: [{ label: 'Rear Delts', type: 'shoulders', star: true }] },\n          { id: 's3', name: 'Single Arm Cable Y Raise',        kind: 'acc',  sets: 2, low: 9, high: 12, each: true,  tags: [{ label: 'Side Delts', type: 'shoulders', star: true }] },\n          { id: 's4', name: 'Single-Arm Lat Pulldown',      kind: 'acc',  sets: 3, low: 9, high: 12, each: false, tags: [{ label: 'Lat', type: 'back' }, { label: 'Right only', type: 'rside' }] },\n          { id: 's5', name: 'Single-Arm DB Shrug',          kind: 'acc',  sets: 2, low: 9, high: 12, each: false, tags: [{ label: 'Traps', type: 'traps' }, { label: 'Right only', type: 'rside' }] },\n          { id: 's6', name: 'Smith Machine Rack Knee Raise', kind: 'acc', sets: 2, low: 10, high: 15, each: false, bw: true, tags: [{ label: 'Abs', type: 'abs' }] },\n          { id: 's7', name: 'GHR Ab Crunch',                kind: 'acc',  sets: 2, low: 9, high: 12, each: false, tags: [{ label: 'Abs', type: 'abs' }] },\n        ],\n      },\n      {\n        section: 'Lower Body', location: 'GYM',\n        exercises: [\n          { id: 'p1', name: 'Pendulum Squat',               kind: 'main', sets: 2, low: 6, high: 9,  each: false, tags: [{ label: 'Glutes / Quads', type: 'gluteham', star: true }] },\n          { id: 'p2', name: 'Machine Good Morning',         kind: 'main', sets: 3, low: 6, high: 9,  each: false, tags: [{ label: 'Glutes / Hams', type: 'gluteham', star: true }] },\n          { id: 'p3', name: 'Machine Hip Adduction',        kind: 'acc',  sets: 3, low: 9, high: 12, each: false, tags: [{ label: 'Adductors', type: 'adductors' }] },\n          { id: 'p4', name: 'Seated Leg Curl',              kind: 'acc',  sets: 3, low: 9, high: 12, each: false, tags: [{ label: 'Hams', type: 'hams' }] },\n          { id: 'p5', name: 'Leg Extension',                kind: 'acc',  sets: 3, low: 9, high: 12, each: false, tags: [{ label: 'Quads', type: 'quads' }] },\n          { id: 'p6', name: 'Standing Calf Raise',          kind: 'acc',  sets: 3, low: 9, high: 12, each: false, tags: [{ label: 'Calves', type: 'calves' }] },\n        ],\n      },\n      {\n        section: 'Push', location: 'GYM',\n        exercises: [\n          { id: 'a1', name: 'Bulgarian Split Squat',        kind: 'main', sets: 2, low: 6, high: 9,  each: true,  tags: [{ label: 'Glutes / Quads', type: 'gluteham', star: true }] },\n          { id: 'a2', name: 'Rear-Facing Incline DB Swings', kind: 'main', sets: 3, low: 25, high: 25, each: false, tags: [{ label: 'Side Delts', type: 'shoulders', star: true }] },\n          { id: 'a3', name: 'Machine Shoulder Press',       kind: 'main', sets: 2, low: 6, high: 9,  each: false, tags: [{ label: 'Shoulders', type: 'shoulders', star: true }] },\n          { id: 'a4', name: 'Reverse Grip Cable Front Raise', kind: 'acc', sets: 3, low: 9, high: 12, each: false, tags: [{ label: 'Front Delts', type: 'shoulders', star: true }] },\n          { id: 'a5', name: 'Reverse Hack Squat',           kind: 'acc',  sets: 3, low: 6, high: 9,  each: false, tags: [{ label: 'Glutes / Quads', type: 'gluteham', star: true }] },\n          { id: 'a6', name: 'Overhead Cable Triceps Ext',   kind: 'acc',  sets: 3, low: 9, high: 12, each: false, tags: [{ label: 'Triceps', type: 'triceps' }] },\n          { id: 'a7', name: 'Glute Runner Machine',         kind: 'acc',  sets: 2, low: 9, high: 12, each: true,  tags: [{ label: 'Glutes', type: 'glutes', star: true }] },\n        ],\n      },\n      {\n        section: 'Pull', location: 'GYM',\n        exercises: [\n          { id: 'q1', name: 'Machine Good Morning',         kind: 'main', sets: 2, low: 9, high: 12, each: false, tags: [{ label: 'Glutes / Hams', type: 'gluteham', star: true }] },\n          { id: 'q2', name: 'Single-Arm Underhand Cable Row', kind: 'main', sets: 2, low: 6, high: 9, each: false, tags: [{ label: 'Back', type: 'back' }, { label: 'Right only', type: 'rside' }] },\n          { id: 'q3', name: 'Single-Arm Smith Machine Shrug', kind: 'acc',  sets: 2, low: 9, high: 12, each: false, tags: [{ label: 'Traps', type: 'traps' }, { label: 'Right only', type: 'rside' }] },\n          { id: 'q4', name: 'Lying Leg Curl',               kind: 'acc',  sets: 3, low: 9, high: 12, each: false, tags: [{ label: 'Hams', type: 'hams' }] },\n          { id: 'q5', name: 'Cable Glute Kickback',         kind: 'acc',  sets: 2, low: 9, high: 12, each: true,  tags: [{ label: 'Glutes', type: 'glutes', star: true }] },\n          { id: 'q6', name: 'Hanging Leg Raise',            kind: 'acc',  sets: 3, low: 9, high: 12, each: false, tags: [{ label: 'Abs', type: 'abs' }] },\n        ],\n      },\n    ];\n  }\n\n  resolveSets(ex, store) {\n    const hist = store.history[ex.id] || null;\n    const suggest = hist && hist.suggest ? hist.suggest : null;\n    const sessEx = this.state.session[ex.id] || {};\n    const rows = [];\n    for (let i = 0; i < ex.sets; i++) {\n      const sv = sessEx[i] || {};\n      const wVal = sv.w !== undefined ? sv.w : (suggest && suggest.weight != null ? String(suggest.weight) : '');\n      const rVal = sv.r !== undefined ? sv.r : '';\n      rows.push({ wVal, rVal, w: parseFloat(wVal), r: parseFloat(rVal) });\n    }\n    return { rows, suggest, hist };\n  }\n\n  evaluate(ex, parsed) {\n    if (ex.bw) {\n      const cbw = parsed.length === ex.sets && parsed.every(p => p.r > 0);\n      if (!cbw) return { status: 'incomplete', complete: false, bw: true };\n      const anyTopB = parsed.some(p => p.r >= ex.high);\n      const anyBelowB = parsed.some(p => p.r < ex.low);\n      if (anyTopB && !anyBelowB) return { status: 'add', complete: true, bw: true, nextReps: ex.high };\n      if (anyBelowB) return { status: 'reduce', complete: true, bw: true, nextReps: ex.low };\n      return { status: 'keep', complete: true, bw: true, nextReps: ex.high };\n    }\n    const complete = parsed.length === ex.sets && parsed.every(p => p.w > 0 && p.r > 0);\n    if (!complete) return { status: 'incomplete', complete: false };\n    const anyTop = parsed.some(p => p.r >= ex.high);\n    const anyBelow = parsed.some(p => p.r < ex.low);\n    let best = parsed[0];\n    parsed.forEach(p => { if (p.r > best.r || (p.r === best.r && p.w > best.w)) best = p; });\n    const e1rm = this.epley(best.w, best.r);\n    const curW = Math.max.apply(null, parsed.map(p => p.w));\n    if (anyTop && !anyBelow) {\n      let raw = this.wForReps(e1rm, ex.low);\n      raw = Math.max(curW + 2.5, Math.min(raw, curW * 1.10));\n      let next = this.round25(raw);\n      if (next <= curW) next = this.round25(curW + 2.5);\n      return { status: 'add', complete: true, e1rm, nextWeight: next, nextReps: ex.low, curW };\n    }\n    if (anyBelow) {\n      let next = this.round25(Math.min(this.wForReps(e1rm, ex.low), curW - 2.5));\n      if (next >= curW) next = this.round25(curW - 2.5);\n      if (next < 2.5) next = 2.5;\n      return { status: 'reduce', complete: true, e1rm, nextWeight: next, nextReps: ex.low, curW };\n    }\n    return { status: 'keep', complete: true, e1rm, nextWeight: curW, nextReps: ex.high, curW };\n  }\n\n  verdictVisual(v, ex) {\n    if (v.bw) {\n      if (v.status === 'add') return { label: 'Progress \\u2191', color: '#1f7a44', bg: '#e7f6ec', border: '#bfe6cd', detail: 'Hit ' + ex.high + ' reps \\u2014 add a rep or light load next time.' };\n      if (v.status === 'reduce') return { label: 'Build up', color: '#c0392b', bg: '#fdecea', border: '#f3c6bf', detail: 'Below ' + ex.low + ' reps \\u2014 keep at bodyweight and build volume.' };\n      if (v.status === 'keep') return { label: 'Repeat', color: '#9a6a12', bg: '#fdf3df', border: '#f0dca8', detail: 'In range \\u2014 push toward ' + ex.high + ' reps.' };\n      return { label: 'Log all sets', color: '#8a8289', bg: '#f2eff1', border: '#e2dde0', detail: 'Bodyweight \\u2014 enter reps for every set.' };\n    }\n    if (v.status === 'add') return { label: 'Add weight \\u2191', color: '#1f7a44', bg: '#e7f6ec', border: '#bfe6cd', detail: 'Hit ' + ex.high + ' on a set \\u2014 progression earned. Next session: ' + this.fmt(v.nextWeight) + ' lb \\u00d7 ' + v.nextReps + ' reps.' };\n    if (v.status === 'reduce') return { label: 'Ease back', color: '#c0392b', bg: '#fdecea', border: '#f3c6bf', detail: 'A set fell below ' + ex.low + ' reps \\u2014 too heavy. Next session: ' + this.fmt(v.nextWeight) + ' lb to rebuild into the range.' };\n    if (v.status === 'keep') return { label: 'Repeat', color: '#9a6a12', bg: '#fdf3df', border: '#f0dca8', detail: 'In range, but no set hit ' + ex.high + ' yet. Keep ' + this.fmt(v.curW) + ' lb and push for ' + ex.high + ' reps.' };\n    return { label: 'Log all sets', color: '#8a8289', bg: '#f2eff1', border: '#e2dde0', detail: 'Enter weight and reps for every set to get your progression call.' };\n  }\n\n  updateSet(exId, idx, field, val) {\n    this.setState(s => {\n      const session = Object.assign({}, s.session);\n      const ex = Object.assign({}, session[exId] || {});\n      const cell = Object.assign({}, ex[idx] || {});\n      cell[field] = val;\n      ex[idx] = cell;\n      session[exId] = ex;\n      this.writeDraft(session); // persist every keystroke\n      return { session, saved: false };\n    });\n  }\n\n  saveWorkout() {\n    const dd = this.buildDays()[this.state.activeDay - 1];\n    const store = JSON.parse(JSON.stringify(this.state.store || { history: {} }));\n    if (!store.history) store.history = {};\n    let logged = 0, progressed = 0;\n    dd.exercises.forEach(ex => {\n      const { rows } = this.resolveSets(ex, store);\n      const parsed = rows.map(r => ({ w: r.w, r: r.r }));\n      const complete = ex.bw ? parsed.every(p => p.r > 0) : parsed.every(p => p.w > 0 && p.r > 0);\n      if (!complete) return;\n      logged++;\n      const v = this.evaluate(ex, parsed);\n      if (v.status === 'add') progressed++;\n      let suggest;\n      if (ex.bw) suggest = { weight: null, reps: v.nextReps };\n      else suggest = (v.status === 'keep') ? { weight: v.curW, reps: v.nextReps } : { weight: v.nextWeight, reps: v.nextReps };\n      store.history[ex.id] = { last: { sets: parsed.map(p => ({ w: ex.bw ? null : p.w, r: p.r })), date: Date.now() }, suggest };\n    });\n    store.performed = Object.assign({}, store.performed || {}, { [this.state.activeDay]: true });\n    try { localStorage.setItem(this.KEY, JSON.stringify(store)); } catch (e) {}\n    let msg, ok;\n    if (logged === 0) { msg = 'Nothing logged yet \\u2014 fill in weight and reps for at least one exercise, then save.'; ok = false; }\n    else {\n      const d = new Date();\n      const t = d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });\n      msg = 'Saved ' + t + '  \\u00b7  ' + logged + ' logged  \\u00b7  ' + progressed + ' ready to add weight. Tap \\u201cStart next session\\u201d to load your pre-filled targets.';\n      ok = true;\n    }\n    this.setState({ store, saved: true, savedOk: ok, savedText: msg });\n  }\n\n  renderVals() {\n    const DISPLAY = this.DISPLAY, BODY = this.BODY, PINK = this.PINK;\n    const day = this.state.activeDay;\n    const days = this.buildDays();\n    const dd = days[day - 1];\n    const interactive = true;\n    const accent = PINK;\n    const store = this.state.store || { history: {} };\n\n    const eyebrowStyle = { fontFamily: DISPLAY, fontWeight: 700, fontSize: '13px', letterSpacing: '.16em', color: accent, textTransform: 'uppercase' };\n    const progressLabelStyle = { fontFamily: DISPLAY, fontWeight: 700, fontSize: '12px', letterSpacing: '.16em', color: accent };\n\n    const tabBase = { fontFamily: BODY, fontWeight: 800, fontSize: '13px', padding: '11px 2px', textAlign: 'center', flex: '1', borderRadius: '10px', cursor: 'pointer', letterSpacing: '.005em', transition: 'background .15s, color .15s', userSelect: 'none' };\n    const dayTabs = days.map((d, i) => {\n      const n = i + 1;\n      const act = n === day;\n      return {\n        label: 'Day ' + n,\n        onClick: () => { this.setState({ activeDay: n, saved: false }); try { window.scrollTo({ top: 0 }); } catch (e) {} },\n        style: act ? Object.assign({}, tabBase, { background: PINK, color: '#fff' }) : Object.assign({}, tabBase, { background: 'transparent', color: '#a49aa0' }),\n      };\n    });\n\n    const loc = { color: '#d61f6b', bg: '#ffe6f0', border: '#ffb8d5' };\n    const locationStyle = { fontFamily: DISPLAY, fontWeight: 700, fontSize: '13px', letterSpacing: '.1em', padding: '7px 12px', borderRadius: '9px', border: '1.5px solid ' + loc.border, color: loc.color, background: loc.bg, whiteSpace: 'nowrap' };\n\n    const exercises = dd.exercises.map(ex => {\n      const kindLabel = ex.kind === 'main' ? 'MAIN' : 'ACCESSORY';\n      const kindColor = ex.kind === 'main' ? accent : '#a49aa0';\n      const kindStyle = { fontFamily: DISPLAY, fontWeight: 700, fontSize: '13px', letterSpacing: '.11em', color: kindColor };\n      const scheme = ex.sets + ' \\u00d7 ' + ex.low + '\\u2013' + ex.high + (ex.each ? ' ea.' : '');\n      const tags = ex.tags.map(t => {\n        const st = this.tagStyle(t.type);\n        return { label: (t.star ? (t.label + ' \\u2605') : t.label), style: { fontFamily: DISPLAY, fontWeight: 700, fontSize: '12px', letterSpacing: '.05em', padding: '5px 9px', borderRadius: '8px', border: '1.5px solid ' + st.border, color: st.color, background: st.bg, whiteSpace: 'nowrap', textTransform: 'uppercase' } };\n      });\n      const base = { id: ex.id, name: ex.name, tags, kindLabel, kindStyle, scheme, interactive, videoUrl: this.videoFor(ex) };\n      if (!interactive) return base;\n\n      const { rows, suggest, hist } = this.resolveSets(ex, store);\n      const goalReps = suggest && suggest.reps ? suggest.reps : ex.low;\n      const suggestWeight = suggest && suggest.weight != null ? suggest.weight : null;\n      const parsed = rows.map(r => ({ w: r.w, r: r.r }));\n      const repsWrapStyle = ex.bw\n        ? { display: 'flex', alignItems: 'center', gap: '5px', flex: '1', background: '#f5f1f3', borderRadius: '10px', padding: '11px 12px' }\n        : { display: 'flex', alignItems: 'center', gap: '5px', width: '98px', flex: 'none', background: '#f5f1f3', borderRadius: '10px', padding: '11px 12px' };\n      const sets = rows.map((r, i) => ({\n        label: 'Set ' + (i + 1),\n        w: r.wVal, r: r.rVal,\n        showWeight: !ex.bw,\n        repsWrapStyle,\n        wph: suggestWeight != null ? String(suggestWeight) : 'lb',\n        rph: String(goalReps),\n        onWeight: (e) => this.updateSet(ex.id, i, 'w', e.target.value),\n        onReps: (e) => this.updateSet(ex.id, i, 'r', e.target.value),\n        checkStyle: { color: (!isNaN(r.r) && r.r >= ex.high) ? '#1f7a44' : '#dcd4d8', fontSize: '15px', fontWeight: 800, width: '16px', flex: 'none', textAlign: 'center' },\n      }));\n\n      const v = this.evaluate(ex, parsed);\n      const vv = this.verdictVisual(v, ex);\n      const verdictChipStyle = { fontFamily: DISPLAY, fontWeight: 700, fontSize: '12px', letterSpacing: '.05em', padding: '6px 11px', borderRadius: '8px', color: vv.color, background: vv.bg, border: '1.5px solid ' + vv.border, whiteSpace: 'nowrap', textTransform: 'uppercase' };\n\n      let lastText;\n      if (hist && hist.last) lastText = 'Last \\u00b7 ' + hist.last.sets.map(s => (s.w == null ? 'BW' : this.fmt(s.w)) + '\\u00d7' + s.r).join('  /  ');\n      else lastText = 'First session \\u2014 start near the bottom of the range.';\n\n      const goalText = suggestWeight != null\n        ? ('Goal \\u00b7 ' + goalReps + ' reps @ ' + this.fmt(suggestWeight) + ' lb')\n        : ('Goal \\u00b7 ' + ex.low + ' reps \\u2014 pick your weight');\n\n      const e1rmText = ex.bw ? 'Bodyweight \\u00b7 reps only' : (v.complete ? ('Est. 1RM \\u2248 ' + this.fmt(this.round05(v.e1rm)) + ' lb') : 'Est. 1RM \\u2248 \\u2014');\n\n      return Object.assign(base, { sets, goalText, lastText, e1rmText, verdictChipStyle, verdictLabel: vv.label, verdictDetail: vv.detail });\n    });\n\n    const saveBtnStyle = { fontFamily: DISPLAY, fontWeight: 800, fontSize: '19px', letterSpacing: '.05em', color: '#fff', background: accent, border: 'none', borderRadius: '13px', padding: '16px', width: '100%', cursor: 'pointer' };\n    const startNextStyle = { fontFamily: DISPLAY, fontWeight: 700, fontSize: '14px', letterSpacing: '.04em', color: accent, background: '#fff', border: '1.5px solid ' + accent, borderRadius: '11px', padding: '12px 14px', cursor: 'pointer', whiteSpace: 'nowrap' };\n    const savedBannerStyle = this.state.savedOk\n      ? { fontFamily: BODY, fontSize: '13.5px', fontWeight: 600, lineHeight: 1.45, color: '#1f7a44', background: '#e7f6ec', border: '1.5px solid #bfe6cd', borderRadius: '12px', padding: '12px 14px', marginBottom: '10px' }\n      : { fontFamily: BODY, fontSize: '13.5px', fontWeight: 600, lineHeight: 1.45, color: '#9a6a12', background: '#fdf3df', border: '1.5px solid #f0dca8', borderRadius: '12px', padding: '12px 14px', marginBottom: '10px' };\n\n    const draftNoteStyle = { fontFamily: BODY, fontSize: '12px', fontWeight: 600, color: '#a89fa4', textAlign: 'center', marginBottom: '10px', lineHeight: 1.4 };\n\n    return {\n      eyebrow: '5-Day Program', eyebrowStyle,\n      title: 'BIKINI OFFSEASON PROGRAM',\n      dayTabs,\n      onToggleProgress: () => this.setState(s => ({ progressOpen: !s.progressOpen })),\n      progressLabelStyle,\n      progressOpen: this.state.progressOpen,\n      progressToggleLabel: this.state.progressOpen ? 'Tap to close \\u25b4' : 'Tap to expand \\u25be',\n      sectionTitle: dd.section,\n      locationLabel: dd.location, locationStyle,\n      readonly: !interactive,\n      readonlyNote: 'Logging unlocks here next.',\n      interactive,\n      exercises,\n      onSave: () => this.saveWorkout(),\n      onStartNext: () => { this.writeDraft({}); this.setState({ session: {}, saved: false }); try { window.scrollTo({ top: 0 }); } catch (e) {} },\n      onReset: () => { this.writeDraft({}); this.setState({ session: {}, saved: false }); },\n      saved: this.state.saved, savedText: this.state.savedText, savedBannerStyle,\n      draftNote: 'Your entries save automatically as you type \\u2014 tap SAVE WORKOUT to lock in the session and get your progression targets.',\n      draftNoteStyle,\n      saveBtnStyle, startNextStyle,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
